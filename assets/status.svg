<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><title id="t">Estado de buenas prácticas</title><desc id="d">Cuatro tarjetas de estado: backups verificados, cambios con rollback, accesos por clave y nominales, documentación al día.</desc><defs></defs><rect width="1200" height="150" rx="18" fill="#0d1326"/><rect x="10" y="15" width="277" height="120" rx="14" fill="#141b35" stroke="#243056" stroke-width="1.5"/><rect x="10" y="29" width="4" height="92" rx="2" fill="#34d399"/><text x="38" y="55" font-size="15" fill="#8f9bc4" letter-spacing="1.5">BACKUPS</text><text x="38" y="98" font-size="24" font-weight="700" fill="#e8ecff">Verificados</text><circle cx="257" cy="40" r="5" fill="#34d399"/><circle cx="257" cy="40" r="5" fill="none" stroke="#34d399" stroke-width="2"><animate attributeName="r" values="5;15" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/></circle><rect x="38" y="112" width="221" height="5" rx="2.5" fill="#243056"/><rect x="38" y="112" width="0" height="5" rx="2.5" fill="#34d399"><animate attributeName="width" from="0" to="221" dur="1.4s" begin="0.0s" fill="freeze"/></rect><rect x="307" y="15" width="277" height="120" rx="14" fill="#141b35" stroke="#243056" stroke-width="1.5"/><rect x="307" y="29" width="4" height="92" rx="2" fill="#38bdf8"/><text x="335" y="55" font-size="15" fill="#8f9bc4" letter-spacing="1.5">CAMBIOS</text><text x="335" y="98" font-size="24" font-weight="700" fill="#e8ecff">Con rollback</text><circle cx="554" cy="40" r="5" fill="#38bdf8"/><circle cx="554" cy="40" r="5" fill="none" stroke="#38bdf8" stroke-width="2"><animate attributeName="r" values="5;15" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/></circle><rect x="335" y="112" width="221" height="5" rx="2.5" fill="#243056"/><rect x="335" y="112" width="0" height="5" rx="2.5" fill="#38bdf8"><animate attributeName="width" from="0" to="221" dur="1.4s" begin="0.3s" fill="freeze"/></rect><rect x="604" y="15" width="277" height="120" rx="14" fill="#141b35" stroke="#243056" stroke-width="1.5"/><rect x="604" y="29" width="4" height="92" rx="2" fill="#a78bfa"/><text x="632" y="55" font-size="15" fill="#8f9bc4" letter-spacing="1.5">ACCESOS</text><text x="632" y="98" font-size="24" font-weight="700" fill="#e8ecff">Por clave, nominales</text><circle cx="851" cy="40" r="5" fill="#a78bfa"/><circle cx="851" cy="40" r="5" fill="none" stroke="#a78bfa" stroke-width="2"><animate attributeName="r" values="5;15" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/></circle><rect x="632" y="112" width="221" height="5" rx="2.5" fill="#243056"/><rect x="632" y="112" width="0" height="5" rx="2.5" fill="#a78bfa"><animate attributeName="width" from="0" to="221" dur="1.4s" begin="0.6s" fill="freeze"/></rect><rect x="901" y="15" width="277" height="120" rx="14" fill="#141b35" stroke="#243056" stroke-width="1.5"/><rect x="901" y="29" width="4" height="92" rx="2" fill="#fbbf24"/><text x="929" y="55" font-size="15" fill="#8f9bc4" letter-spacing="1.5">DOCUMENTACIÓN</text><text x="929" y="98" font-size="24" font-weight="700" fill="#e8ecff">Al día</text><circle cx="1148" cy="40" r="5" fill="#fbbf24"/><circle cx="1148" cy="40" r="5" fill="none" stroke="#fbbf24" stroke-width="2"><animate attributeName="r" values="5;15" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/></circle><rect x="929" y="112" width="221" height="5" rx="2.5" fill="#243056"/><rect x="929" y="112" width="0" height="5" rx="2.5" fill="#fbbf24"><animate attributeName="width" from="0" to="221" dur="1.4s" begin="0.9s" fill="freeze"/></rect></svg>