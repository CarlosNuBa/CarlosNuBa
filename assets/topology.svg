<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><title id="t">Topología de trabajo</title><desc id="d">Diagrama: usuarios llegan al borde con proxy; del borde salen las VLANs y el directorio con DNS; las VLANs alimentan Proxmox, que envía copias a los backups; el SOC con Wazuh vigila Proxmox y el directorio. Paquetes animados recorren los enlaces.</desc><defs></defs><rect width="1200" height="380" rx="18" fill="#0d1326"/><text x="40" y="52" font-size="22" font-weight="700" fill="#e8ecff">Topología de trabajo</text><text x="40" y="78" font-size="15" fill="#8f9bc4">Cómo suelo organizar un entorno: borde, segmentos, cómputo, copias y vigilancia.</text><line x1="110" y1="230" x2="330" y2="230" stroke="#243056" stroke-width="3"/><line x1="330" y1="230" x2="550" y2="140" stroke="#243056" stroke-width="3"/><line x1="330" y1="230" x2="550" y2="320" stroke="#243056" stroke-width="3"/><line x1="550" y1="140" x2="800" y2="140" stroke="#243056" stroke-width="3"/><line x1="800" y1="140" x2="1040" y2="140" stroke="#243056" stroke-width="3"/><line x1="550" y1="320" x2="800" y2="320" stroke="#243056" stroke-width="3"/><line x1="800" y1="140" x2="800" y2="320" stroke="#243056" stroke-width="3"/><circle r="5" fill="#fbbf24"><animate attributeName="cx" values="110;330" dur="2.40s" repeatCount="indefinite"/><animate attributeName="cy" values="230;230" dur="2.40s" repeatCount="indefinite"/></circle><circle r="5" fill="#fbbf24"><animate attributeName="cx" values="330;550" dur="2.75s" repeatCount="indefinite"/><animate attributeName="cy" values="230;140" dur="2.75s" repeatCount="indefinite"/></circle><circle r="5" fill="#fbbf24"><animate attributeName="cx" values="330;550" dur="3.10s" repeatCount="indefinite"/><animate attributeName="cy" values="230;320" dur="3.10s" repeatCount="indefinite"/></circle><circle r="5" fill="#fbbf24"><animate attributeName="cx" values="550;800" dur="3.45s" repeatCount="indefinite"/><animate attributeName="cy" values="140;140" dur="3.45s" repeatCount="indefinite"/></circle><circle r="5" fill="#fbbf24"><animate attributeName="cx" values="800;1040" dur="3.80s" repeatCount="indefinite"/><animate attributeName="cy" values="140;140" dur="3.80s" repeatCount="indefinite"/></circle><circle r="5" fill="#fbbf24"><animate attributeName="cx" values="550;800" dur="4.15s" repeatCount="indefinite"/><animate attributeName="cy" values="320;320" dur="4.15s" repeatCount="indefinite"/></circle><circle r="5" fill="#fbbf24"><animate attributeName="cx" values="800;800" dur="4.50s" repeatCount="indefinite"/><animate attributeName="cy" values="140;320" dur="4.50s" repeatCount="indefinite"/></circle><rect x="38" y="204" width="144" height="52" rx="12" fill="#141b35" stroke="#38bdf8" stroke-width="2.5"/><text x="110" y="236" text-anchor="middle" font-size="16" font-weight="600" fill="#e8ecff">Usuarios</text><rect x="258" y="204" width="144" height="52" rx="12" fill="#141b35" stroke="#a78bfa" stroke-width="2.5"/><text x="330" y="236" text-anchor="middle" font-size="16" font-weight="600" fill="#e8ecff">Borde · Proxy</text><rect x="478" y="114" width="144" height="52" rx="12" fill="#141b35" stroke="#34d399" stroke-width="2.5"/><text x="550" y="146" text-anchor="middle" font-size="16" font-weight="600" fill="#e8ecff">VLANs</text><rect x="478" y="294" width="144" height="52" rx="12" fill="#141b35" stroke="#f472b6" stroke-width="2.5"/><text x="550" y="326" text-anchor="middle" font-size="16" font-weight="600" fill="#e8ecff">AD · DNS</text><rect x="728" y="114" width="144" height="52" rx="12" fill="#141b35" stroke="#fbbf24" stroke-width="2.5"/><text x="800" y="146" text-anchor="middle" font-size="16" font-weight="600" fill="#e8ecff">Proxmox</text><rect x="968" y="114" width="144" height="52" rx="12" fill="#141b35" stroke="#34d399" stroke-width="2.5"/><text x="1040" y="146" text-anchor="middle" font-size="16" font-weight="600" fill="#e8ecff">Backups</text><rect x="728" y="294" width="144" height="52" rx="12" fill="#141b35" stroke="#38bdf8" stroke-width="2.5"/><text x="800" y="326" text-anchor="middle" font-size="16" font-weight="600" fill="#e8ecff">SOC · Wazuh</text></svg>